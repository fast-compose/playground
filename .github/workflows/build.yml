name: build

on:
  # Pull requests get a debug build of every platform.
  pull_request:
    branches: [main]
  # Tags produce release builds and publish them as a GitHub release.
  push:
    tags: ["v*"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- pull request: debug builds ---------------------------------------------------

  check:
    name: debug (Android, Linux desktop, web)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      # gradlew is not executable in git, since it was added on Windows.
      - run: chmod +x gradlew

      - name: Build
        run: >
          ./gradlew
          :androidApp:assembleDefaultDebug
          :desktopApp:packageDeb
          :webApp:wasmJsBrowserDevelopmentExecutableDistribution

      - uses: actions/upload-artifact@v7
        with:
          name: android-debug
          path: androidApp/build/outputs/apk/default/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: linux-debug
          path: desktopApp/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: web-debug
          path: webApp/build/dist/wasmJs/developmentExecutable/
          if-no-files-found: error

  # --- tag: release builds ----------------------------------------------------------

  # The tag must match the app version, so v0.1.0 releases 0.1.0.
  version:
    name: check tag
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches version
        run: |
          version=$(grep '^project-versionName' gradle/libs.versions.toml | cut -d'"' -f2)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match project-versionName $version"
            exit 1
          fi

  android:
    name: release (Android)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - run: chmod +x gradlew

      - name: Decode keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set - refusing to publish an unsigned release"
            exit 1
          fi
          mkdir -p keys
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > keys/release.keystore

      - name: Build defaultRelease
        env:
          RELEASE_STORE_FILE: keys/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleDefaultRelease

      - name: Remove keystore
        if: always()
        run: rm -rf keys

      - name: Name the APK
        run: |
          set -euo pipefail
          apk=$(find androidApp/build/outputs/apk/default/release -name '*.apk' | head -1)
          if [ -z "$apk" ]; then
            echo "::error::No APK produced"
            exit 1
          fi
          mkdir -p out
          cp "$apk" "out/compose-playground-${GITHUB_REF_NAME}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: out/*
          if-no-files-found: error

  desktop:
    name: release (${{ matrix.name }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            task: packageDeb
            format: deb
            suffix: linux-amd64
          - name: macOS
            os: macos-latest
            task: packageDmg
            format: dmg
            suffix: macos
          - name: Windows
            os: windows-latest
            task: packageMsi
            format: msi
            suffix: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - run: chmod +x gradlew

      - name: Build ${{ matrix.task }}
        run: ./gradlew :desktopApp:${{ matrix.task }}

      - name: Name the package
        run: |
          set -euo pipefail
          file=$(find desktopApp/build/compose/binaries/main/${{ matrix.format }} \
            -name '*.${{ matrix.format }}' | head -1)
          if [ -z "$file" ]; then
            echo "::error::No .${{ matrix.format }} produced"
            exit 1
          fi
          mkdir -p out
          cp "$file" "out/compose-playground-${GITHUB_REF_NAME}-${{ matrix.suffix }}.${{ matrix.format }}"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.suffix }}
          path: out/*
          if-no-files-found: error

  web:
    name: release (web)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - run: chmod +x gradlew

      - name: Build the production web app
        run: ./gradlew :webApp:wasmJsBrowserDistribution

      - name: Zip it
        run: |
          set -euo pipefail
          mkdir -p out
          cd webApp/build/dist/wasmJs/productionExecutable
          zip -r "$GITHUB_WORKSPACE/out/compose-playground-${GITHUB_REF_NAME}-web.zip" .

      - uses: actions/upload-artifact@v7
        with:
          name: release-web
          path: out/*
          if-no-files-found: error

  publish:
    name: publish GitHub release
    needs: [android, desktop, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: out
          merge-multiple: true

      # the release is titled with the bare version: v0.1.0 becomes 0.1.0
      - name: Read the version
        id: version
        run: echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: out/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
